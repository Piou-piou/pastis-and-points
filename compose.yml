services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: petanque-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: petanque
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - petanque-net

  # API Backend
  api:
    build:
      context: ./server
    container_name: petanque-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=petanque
    depends_on:
      - mysql
    networks:
      - petanque-net

networks:
  petanque-net:
    driver: bridge
