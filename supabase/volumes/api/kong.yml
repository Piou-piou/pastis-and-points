_format_version: "1.1"

services:
  - name: rest
    url: http://supabase-postgrest:3000
    routes:
      - name: rest-filter
        paths:
          - /rest/v1
        strip_path: true
  - name: auth
    url: http://supabase-gotrue:9999
    routes:
      - name: auth-filter
        paths:
          - /auth/v1
        strip_path: true
  - name: realtime
    url: http://supabase-realtime:4000
    routes:
      - name: realtime-filter
        paths:
          - /realtime/v1
        strip_path: true

plugins:
  - name: request-transformer
    config:
      add:
        headers:
          - "apikey: ${SUPABASE_ANON_KEY}"
